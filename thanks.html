<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danke | Phoenixflames</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="brand" aria-label="Phoenixflames Startseite">
      <img src="/LogoKlein.jpg" alt="Phoenixflames Logo">
    </a>

    <div class="nav-links">
      <a href="/shows.html">Fire Shows</a>
      <a href="/workshops.html">Workshops</a>
      <a href="/tools.html">Fire Tools</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/booking.html">Booking</a>
    </div>
  </nav>

  <main class="thanks-main">
    <section class="thanks-card">
      <p class="eyebrow">Message received</p>
      <h1>Thank you.</h1>

      <div class="thanks-emblem" aria-label="Phoenixflames Emblem-Animation">
        <img
          id="thanks-emblem-fallback"
          src="/LogoKlein.jpg"
          alt="Phoenixflames Emblem"
          width="320"
          height="320"
        >
        <video
          id="thanks-emblem-video"
          aria-label="Animiertes Phoenixflames Emblem"
          autoplay
          muted
          playsinline
          controls
          preload="metadata"
          width="320"
          height="320"
          hidden
        >
          <source src="/Emblem.mp4" type="video/mp4">
          Dein Browser unterstützt die Videowiedergabe nicht.
        </video>
      </div>

      <p class="thanks-tagline">Your spark has reached us.</p>
      <p>
        Deine Anfrage wurde übermittelt. Wir melden uns so bald wie möglich bei dir.
      </p>

      <a class="button button-primary" href="/">Zurück zu Phoenixflames</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Phoenixflames</span>
      <nav class="footer-links" aria-label="Weitere Links">
        <a href="https://www.instagram.com/1phoenixflames9/" target="_blank" rel="noopener noreferrer" aria-label="Phoenixflames auf Instagram ansehen (neuer Tab)">Instagram</a>
        <a href="/impressum.html">Impressum</a>
        <a href="/datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <script>
    // Show the video only after the MP4 is actually available;
    // otherwise keep the existing emblem as a graceful fallback.
    const emblemVideo = document.getElementById('thanks-emblem-video');
    const emblemFallback = document.getElementById('thanks-emblem-fallback');

    function revealEmblemVideo() {
      emblemFallback.hidden = true;
      emblemVideo.hidden = false;
      emblemVideo.play().catch(() => {
        // If autoplay is blocked, visitors can use the native play control.
      });
    }

    emblemVideo.addEventListener('loadeddata', revealEmblemVideo, { once: true });
    emblemVideo.addEventListener('error', () => {
      emblemVideo.hidden = true;
      emblemFallback.hidden = false;
    });

    if (emblemVideo.readyState >= 2) {
      revealEmblemVideo();
    }
  </script>
</body>
</html>
